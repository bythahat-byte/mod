name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - run: ./gradlew -p handrestock build --stacktrace
      - run: ./gradlew -p nametags build --stacktrace
      - run: ./gradlew -p invhud build --stacktrace
      - run: ./gradlew -p chunkreload build --stacktrace
      - run: ./gradlew -p peek build --stacktrace
      - name: Check mixin target exists
        run: |
          jar=$(find ~/.gradle/caches .gradle -path '*minecraft*' -name '*.jar' 2>/dev/null | grep -i -E 'clientonly|merged|client' | grep -v sources | head -20)
          echo "$jar"
          for j in $jar; do javap -cp "$j" net.minecraft.client.util.Window 2>/dev/null | grep -i -E 'swapBuffers|getFramebuffer' && break; done
      - uses: actions/upload-artifact@v4
        with:
          name: clipmod
          path: |
            build/libs/*.jar
            handrestock/build/libs/*.jar
            nametags/build/libs/*.jar
            invhud/build/libs/*.jar
            chunkreload/build/libs/*.jar
            peek/build/libs/*.jar
      - name: Commit jar to download/ folder
        if: github.event_name == 'push'
        run: |
          mkdir -p download
          cp build/libs/clipmod-*.jar download/clipmod-1.21.11.jar
          cp handrestock/build/libs/handrestock-*.jar download/handrestock-1.21.11.jar
          cp nametags/build/libs/nametags-*.jar download/nametags-1.21.11.jar
          cp invhud/build/libs/invhud-*.jar download/invhud-1.21.11.jar
          cp chunkreload/build/libs/chunkreload-*.jar download/chunkreload-1.21.11.jar
          cp peek/build/libs/peek-*.jar download/peek-1.21.11.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/
          git diff --cached --quiet || (git commit -m "Update prebuilt jar [skip ci]" && git push)
