name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew -p handrestock genSources -q 2>&1 | tail -5
      - run: |
          jar=$(find ~/.gradle/caches $PWD/handrestock/.gradle -name 'minecraft-*1.21.11*sources.jar' | head -1)
          mkdir -p src && cd src && unzip -q -o "$jar"
          D=net/minecraft/client/gui/DrawContext.java
          echo "=== DrawContext"; grep -n -E "public .* (drawItem|drawStackOverlay|fill|getMatrices|drawGuiTexture|drawTexture|drawBorder|drawStrokedRectangle|getScaledWindowWidth|getScaledWindowHeight)\(" $D
          echo "=== hud registry"; cd ..; for j in $(find ~/.gradle/caches -name 'fabric-rendering-v1*sources*.jar' | head -2); do echo $j; unzip -l $j | grep -i hud; done
          j=$(find ~/.gradle/caches -name 'fabric-rendering-v1*.jar' ! -name '*sources*' | head -1); echo "BIN $j"; unzip -l $j | grep -i -E "hud" | head -20
          mkdir -p fr && cd fr && unzip -q -o $j && for c in $(find . -iname '*Hud*.class'); do javap -cp . ${c%.class} 2>/dev/null; done | head -80
          echo "=== END"
