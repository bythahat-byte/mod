name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "YARN:"; curl -s https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0:3][].version'
          echo "LOADER:"; curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0:3][].version'
          echo "FAPI:"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*1\.21\.11</version>' | tail -3
          echo "LOOM:"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
