name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew genSources -q 2>&1 | tail -5
      - run: |
          jar=$(find ~/.gradle/caches $PWD/.gradle -name 'minecraft-*1.21.11*sources.jar' | head -1)
          mkdir -p src && cd src && unzip -q -o "$jar"
          sed -n 60,110p net/minecraft/client/gui/screen/multiplayer/ConnectScreen.java
          echo "=== onDisconnected body"; sed -n 355,380p net/minecraft/client/network/ClientCommonNetworkHandler.java
          echo "=== HandledScreen slot click"; grep -n "protected void onMouseClick\|public void onMouseClick" net/minecraft/client/gui/screen/ingame/HandledScreen.java
          echo "=== getSelectedSlot"; grep -n "public int getSelectedSlot\|public void setSelectedSlot" net/minecraft/entity/player/PlayerInventory.java
          echo "=== END"
