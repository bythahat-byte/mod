name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew genSources -q 2>&1 | tail -5
      - run: |
          jar=$(find ~/.gradle/caches $PWD/.gradle -name 'minecraft-*1.21.11*sources.jar' | head -1)
          echo "JAR $jar"
          mkdir -p src && cd src && unzip -q -o "$jar"
          echo "=== SoundEngine"; cat net/minecraft/client/sound/SoundEngine.java
          echo "=== SoundSystem refs"; grep -n -E "soundEngine\.|reload|DeviceSpecifier|deviceSpecifier|Device|started|tick\(" net/minecraft/client/sound/SoundSystem.java
          echo "=== AlUtil"; grep -n "static" net/minecraft/client/sound/AlUtil.java
          echo "=== END"
