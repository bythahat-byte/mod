name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew -p handrestock genSources -q 2>&1 | tail -5
      - run: |
          jar=$(find ~/.gradle/caches $PWD/handrestock/.gradle -name 'minecraft-*1.21.11*sources.jar' | head -1)
          mkdir -p src && cd src && unzip -q -o "$jar"
          echo "=== PER imports+class"; grep -n "^import\|^public class" net/minecraft/client/render/entity/PlayerEntityRenderer.java
          echo "=== shouldRenderName defs"; grep -rn -A3 "boolean shouldRenderName()" net/minecraft/entity | head -40
          echo "=== LER hasLabel tail"; sed -n 238,252p net/minecraft/client/render/entity/LivingEntityRenderer.java
          echo "=== draw sig"; grep -n "public .* draw(" net/minecraft/client/font/TextRenderer.java
          echo "=== END"
